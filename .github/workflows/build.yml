name: Windows x64 build and read-only tests
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source version and PowerShell syntax
        shell: pwsh
        run: |
          $source=Get-Content -Raw src/update.h
          if ($source -notmatch '#define NP_VERSION L"([0-9.]+)"') { throw 'Missing source version' }
          ./scripts/validate-version.ps1 -Tag ('v'+$Matches[1])
          Get-ChildItem scripts,tests -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "PowerShell syntax error: $($_.Name)" }
          }
      - name: Build C17 Release with static CRT
        shell: cmd
        run: build.cmd
      - name: Pure protocol, application and configuration tests
        shell: pwsh
        run: |
          & .\bin\Release\NetPilotLite.Tests.exe --feature-tests
          if ($LASTEXITCODE -ne 0) { throw 'Feature tests failed' }
          & .\bin\Release\NetPilotLite.Tests.exe --private-tests
          if ($LASTEXITCODE -ne 0) { throw 'Private update tests failed' }
          & .\bin\Release\NetPilotLite.Tests.exe --routing-tests
          if ($LASTEXITCODE -ne 0) { throw 'Routing tests failed' }
      - name: Package unsigned build with SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ci-output -Force | Out-Null
          Copy-Item -LiteralPath bin/Release/NetPilotLite.exe -Destination ci-output/NetPilotLite.exe
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath ci-output/NetPilotLite.exe).Hash.ToLowerInvariant()
          "$digest  NetPilotLite.exe" | Set-Content -Encoding ascii ci-output/SHA256SUMS.txt
          'UNSIGNED build for review. Not accepted by the application updater.' | Set-Content ci-output/UNSIGNED.txt
          Copy-Item -LiteralPath bin/Release/NetPilotLite-Setup-x64.exe -Destination ci-output/NetPilotLite-Setup-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: NetPilotLite-unsigned-win-x64
          path: ci-output/*
          if-no-files-found: error
