name: Private stable signed update
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag, for example v1.4.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: stable-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - id: source
        shell: pwsh
        run: |
          ./scripts/validate-version.ps1 -Tag $env:RELEASE_TAG
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - shell: cmd
        run: build.cmd
      - name: Read-only regression tests
        shell: pwsh
        run: |
          foreach($test in @('--feature-tests','--private-tests','--routing-tests')) {
            & ./bin/Release/NetPilotLite.Tests.exe $test
            if($LASTEXITCODE){throw "Failed: $test"}
          }
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-review-only
          path: bin/Release/NetPilotLite.exe
          if-no-files-found: error
  sign:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - shell: cmd
        run: build.cmd
      - name: Sign with pinned publisher identity and test package
        shell: pwsh
        env:
          NETPILOT_SIGNING_KEY_B64: ${{ secrets.NETPILOT_SIGNING_KEY_B64 }}
        run: |
          if(!$env:NETPILOT_SIGNING_KEY_B64){throw 'Trusted signing secret is not configured; publication blocked'}
          ./scripts/validate-version.ps1 -Tag $env:RELEASE_TAG
          python ./scripts/package-update.py --key ENV --tag $env:RELEASE_TAG
          if($LASTEXITCODE){throw 'Signing failed'}
          & ./bin/Release/NetPilotLite.Tests.exe --package-test dist/update
          if($LASTEXITCODE){throw 'Signed package verification failed'}
          & ./tests/build_update_tests.cmd ENV
          if($LASTEXITCODE){throw 'Signed mock fixtures failed'}
          python ./tests/private-download-fixture.py ENV
          if($LASTEXITCODE){throw 'Private download fixture failed'}
          & ./bin/Release/NetPilotLite.Tests.exe --private-download-test artifacts/private-download-fixture
          if($LASTEXITCODE){throw 'Private download protocol tests failed'}
          & ./bin/Release/UpdateTests.exe artifacts/update-fixtures
          if($LASTEXITCODE){throw 'Replacement/rollback tests failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: signed-stable-update
          if-no-files-found: error
          path: dist/update/*
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-verifier
          path: bin/Release/NetPilotLite.Tests.exe
          if-no-files-found: error
  publish:
    needs: [build, sign]
    runs-on: windows-2022
    environment: release-publication
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signed-stable-update
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: pinned-verifier
          path: verifier
      - name: Verify, upload draft, read back, then publish stable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG -Directory release -VerifierPath verifier/NetPilotLite.Tests.exe -PublishApproved
