name: Explicit tagged installer release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build product and native bootstrapper without signing secrets
        shell: cmd
        run: |
          call build.cmd
          if errorlevel 1 exit /b 1
          call installer\build.cmd
          if errorlevel 1 exit /b 1
      - name: Read-only tests
        shell: pwsh
        run: |
          & .\bin\Release\NetPilotLite.Tests.exe --feature-tests
          if ($LASTEXITCODE) { throw 'Protocol/config tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-review-only
          path: |
            bin/Release/NetPilotLite.exe
            bin/Release/NetPilotLite-Web-Setup.exe
  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_SIGNING_ENABLED == 'true' && vars.LICENSE_CONFIRMED == 'true' && vars.ASSETS_CLEARED == 'true'
    runs-on: [self-hosted, Windows, X64, netpilot-signing]
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build three assets, sign and verify with pinned identity
        shell: pwsh
        env:
          SIGNING_KEY_PATH: ${{ secrets.SIGNING_KEY_PATH }}
          INNO_COMPILER: ${{ vars.INNO_COMPILER }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid stable tag' }
          & .\scripts\build-release.ps1 -SigningKey $env:SIGNING_KEY_PATH -InnoCompiler $env:INNO_COMPILER
          $version=Get-Content -Raw dist/version.json | ConvertFrom-Json
          if (('v'+$version.version) -ne $env:RELEASE_TAG) { throw 'Source/tag mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-installers-awaiting-acceptance
          path: |
            dist/NetPilotLite-Web-Setup.exe
            dist/NetPilotLite-Offline-Setup.exe
            dist/NetPilotLite-Offline-Setup.exe.update
            dist/NetPilotLite-Portable-x64.zip
            dist/NetPilotLite.exe
            dist/NetPilotLite.exe.update
            dist/version.json
            dist/release-catalog.json
            dist/release-catalog.json.update
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: sign
    if: vars.RELEASE_ALLOWED == 'true'
    runs-on: windows-2022
    environment: release-publication
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-installers-awaiting-acceptance
          path: release
      - name: Publish only the reviewed installer hash after isolated acceptance
        shell: pwsh
        env:
          ACCEPTED_OFFLINE_SHA256: ${{ vars.ACCEPTED_OFFLINE_SHA256 }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:ACCEPTED_OFFLINE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'No isolated installer acceptance recorded' }
          $hash=(Get-FileHash release/NetPilotLite-Offline-Setup.exe).Hash
          if ($hash -ne $env:ACCEPTED_OFFLINE_SHA256) { throw 'This exact installer has not passed acceptance' }
          foreach ($line in Get-Content release/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  ([A-Za-z0-9._-]+)$') { throw 'Invalid checksum entry' }
            if ((Get-FileHash -LiteralPath ('release/'+$Matches[2])).Hash.ToLowerInvariant() -ne $Matches[1]) { throw 'Asset checksum mismatch' }
          }
          & gh release create $env:RELEASE_TAG --repo $env:GH_REPO --verify-tag --generate-notes --title $env:RELEASE_TAG release/*
          if ($LASTEXITCODE) { throw 'Release failed' }
